<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="FLASH"><style>:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f7f9;background:#0c1119;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.shell{max-width:560px;margin:auto;min-height:100dvh;background:#111923;padding:env(safe-area-inset-top) 18px calc(18px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;padding:23px 3px 12px}.logo{font-size:29px;font-weight:950;letter-spacing:-1.9px}.logo span{color:#b9f34c}.demo{font-size:10px;letter-spacing:1.1px;border:1px solid #50673a;color:#c6f88a;border-radius:20px;padding:8px 10px}.intro{padding:14px 3px 20px}.eyebrow{font-size:10px;color:#b9f34c;letter-spacing:2.8px;font-weight:800}.intro h1{font-size:clamp(36px,9vw,52px);line-height:1.04;letter-spacing:-2.2px;margin:12px 0}.intro em{font-style:normal;color:#b9f34c}.intro>p:last-child{color:#9aa7b6;font-size:14px;line-height:1.5}.mapwrap{height:275px;border-radius:23px;overflow:hidden;position:relative;background:#24313c}.mapwrap #map{height:100%;width:100%;z-index:0}.maplabel{position:absolute;bottom:12px;left:12px;z-index:400;background:#101923e8;border-radius:20px;padding:9px 12px;font-size:10px;letter-spacing:.6px;color:#d8e5ec}.panel{background:#1b2633;margin-top:15px;padding:20px;border:1px solid #2b3949;border-radius:23px}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.heading h2{margin:0 0 16px;font-size:21px}.small{background:#293949;border:0;color:#d5e7f3;border-radius:15px;padding:9px 11px;font-size:11px;cursor:pointer}label{display:block;color:#9aafc1;letter-spacing:1.5px;font-size:10px;font-weight:800;margin:14px 0 7px}input{width:100%;background:#101923;border:1px solid #3a4b5b;border-radius:12px;color:white;padding:16px;font-size:15px;outline:none}input:focus{border-color:#b9f34c}.primary{width:100%;background:#b9f34c;color:#111923;border:0;border-radius:13px;padding:17px 10px;font-weight:900;letter-spacing:.6px;margin-top:17px;cursor:pointer}.primary:disabled{opacity:.6}.status{font-size:12px;color:#a4b3c3;line-height:1.5}.suggestions{background:#293949;border-radius:10px;margin-top:5px;overflow:hidden}.suggestions button{display:block;width:100%;background:none;border:0;color:#fff;padding:12px;text-align:left;border-bottom:1px solid #405061;cursor:pointer}.result{padding:15px;background:#101923;border:1px solid #354455;border-radius:13px;margin-top:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}.result strong{display:block;font-size:14px}.result small{color:#9eacba;font-size:11px;display:block;margin-top:5px}.eta{color:#b9f34c;font-weight:900;font-size:21px;white-space:nowrap}.disclaimer{font-size:11px;color:#9eacba;line-height:1.5}footer{font-size:9px;letter-spacing:.5px;color:#758494;text-align:center;margin:22px 0 8px}.leaflet-control-attribution{font-size:9px!important}
</style><title>FLASH — Move now</title><link rel="preconnect" href="https://tile.openstreetmap.org"></head><body><main class="shell"><header><div class="logo">FLASH<span>.</span></div><div class="demo">● DEMO MODE</div></header><section class="intro"><p class="eyebrow">YOUR CITY. YOUR TIME.</p><h1>Muoviti.<br><em>Senza aspettare.</em></h1><p>Trova la soluzione più veloce per arrivare a destinazione.</p></section><section class="mapwrap"><div id="map" role="img" aria-label="Mappa interattiva"></div><div class="maplabel">MAPPA LIVE · POSIZIONI SIMULATE</div></section><section class="panel"><div class="heading"><h2>La tua corsa</h2><button id="locate" class="small">◎ Usa posizione</button></div><label for="origin">PARTENZA</label><input id="origin" placeholder="Indirizzo di partenza" value="Milano Centrale" autocomplete="off"><label for="destination">DESTINAZIONE</label><input id="destination" placeholder="Dove vuoi andare?" autocomplete="off"><div id="suggestions" class="suggestions" hidden></div><button id="match" class="primary">⚡ TROVA FLASH MATCH</button><p id="status" class="status" aria-live="polite">Scegli una destinazione per iniziare.</p><div id="results" hidden></div></section><footer>FLASH PROTOTYPE · Nessuna corsa reale prenotabile · © 2026</footer></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script>const $=id=>document.getElementById(id);
const places=[{name:'Milano Centrale',lat:45.4857,lng:9.2043},{name:'Duomo di Milano',lat:45.4642,lng:9.1916},{name:'Milano Porta Garibaldi',lat:45.4844,lng:9.1877},{name:'CityLife Milano',lat:45.4776,lng:9.1549},{name:'Navigli Milano',lat:45.4514,lng:9.1756},{name:'Milano Linate',lat:45.4451,lng:9.2767},{name:'Roma Termini',lat:41.9010,lng:12.5018},{name:'Colosseo Roma',lat:41.8902,lng:12.4922}];
let origin={...places[0]},destination=null,map,originMarker,destMarker,carMarkers=[];
function status(t){$('status').textContent=t}
function pin(p,color){return L.circleMarker([p.lat,p.lng],{radius:9,color:'#fff',weight:2,fillColor:color,fillOpacity:1}).addTo(map)}
if(typeof L!=='undefined'){map=L.map('map',{zoomControl:false}).setView([origin.lat,origin.lng],13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);L.control.zoom({position:'topright'}).addTo(map);originMarker=pin(origin,'#b9f34c')}else{status('Mappa non disponibile senza connessione. Puoi comunque provare la simulazione.')}
function selectPlace(p,kind){if(kind==='destination'){destination=p;$('destination').value=p.name;if(map){if(destMarker)map.removeLayer(destMarker);destMarker=pin(p,'#5dbcf5');map.fitBounds([[origin.lat,origin.lng],[p.lat,p.lng]],{padding:[35,35],maxZoom:14})}}else{origin=p;$('origin').value=p.name;if(map){map.removeLayer(originMarker);originMarker=pin(p,'#b9f34c');map.setView([p.lat,p.lng],13)}}$('suggestions').hidden=true;$('results').hidden=true}
let active='destination';['origin','destination'].forEach(kind=>{$(kind).addEventListener('input',e=>{active=kind;const q=e.target.value.trim().toLowerCase();if(kind==='destination')destination=null;const found=q.length>1?places.filter(p=>p.name.toLowerCase().includes(q)).slice(0,5):[];const el=$('suggestions');el.replaceChildren();found.forEach(p=>{const b=document.createElement('button');b.textContent='⌖ '+p.name;b.addEventListener('click',()=>selectPlace(p,kind));el.appendChild(b)});el.hidden=!found.length});$(kind).addEventListener('focus',e=>{if(e.target.value)e.target.dispatchEvent(new Event('input'))})});
$('locate').addEventListener('click',()=>{if(!navigator.geolocation){status('Geolocalizzazione non disponibile.');return}status('Richiesta posizione in corso…');navigator.geolocation.getCurrentPosition(p=>{selectPlace({name:'La mia posizione',lat:p.coords.latitude,lng:p.coords.longitude},'origin');status('Posizione rilevata. Seleziona la destinazione.')},()=>status('Posizione non autorizzata o non disponibile. Seleziona una partenza dalla lista.'),{enableHighAccuracy:true,timeout:10000})});
function km(a,b){const R=6371,dlat=(b.lat-a.lat)*Math.PI/180,dlon=(b.lng-a.lng)*Math.PI/180,x=Math.sin(dlat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dlon/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
$('match').addEventListener('click',()=>{if(!destination){status('Seleziona una destinazione dai suggerimenti per avviare FLASH MATCH.');return}const btn=$('match');btn.disabled=true;status('FLASH MATCH sta confrontando le opzioni simulate…');$('results').hidden=true;setTimeout(()=>{const distance=km(origin,destination),base=Math.max(8,Math.round(6+distance*1.75));const options=[{name:'FLASH FAST',sub:'Taxi partner · simulazione',eta:2+Math.round(distance%4),price:`~ €${base}–${base+4}`},{name:'FLASH VALUE',sub:'Opzione economica · simulazione',eta:5+Math.round(distance%5),price:`~ €${Math.max(7,base-2)}–${base+2}`},{name:'FLASH COMFORT',sub:'Servizio premium · simulazione',eta:4+Math.round(distance%4),price:`~ €${base+8}–${base+13}`}].sort((a,b)=>a.eta-b.eta);const r=$('results');r.replaceChildren();options.forEach((o,i)=>{const row=document.createElement('div');row.className='result';const left=document.createElement('div'),name=document.createElement('strong'),sub=document.createElement('small'),right=document.createElement('div'),eta=document.createElement('div'),price=document.createElement('small');name.textContent=(i===0?'⚡ ':'')+o.name;sub.textContent=o.sub;eta.className='eta';eta.textContent=o.eta+' min';price.textContent=o.price;left.append(name,sub);right.append(eta,price);row.append(left,right);r.appendChild(row)});const note=document.createElement('p');note.className='disclaimer';note.textContent='DEMO: auto, tempi e prezzi sono generati artificialmente. Nessun veicolo è stato contattato. I prezzi taxi reali dipendono dalle tariffe applicabili; nessuna prenotazione o pagamento è possibile.';r.appendChild(note);r.hidden=false;btn.disabled=false;status('3 opzioni simulate trovate. Nessuna disponibilità reale verificata.');if(map){carMarkers.forEach(m=>map.removeLayer(m));carMarkers=[];for(let i=0;i<3;i++){const angle=i*2.1,offset=.004+i*.002;carMarkers.push(L.circleMarker([origin.lat+Math.cos(angle)*offset,origin.lng+Math.sin(angle)*offset],{radius:6,color:'#111923',weight:2,fillColor:'#b9f34c',fillOpacity:1}).addTo(map))}}},650)});

</script></body></html>
